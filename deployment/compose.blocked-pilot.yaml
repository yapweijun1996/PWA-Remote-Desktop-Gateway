# Real Access-authenticated status pilot. Desktop is blocked by production policy.
# No guacd, VNC credential or test identity signer is started.
name: rdg-${RDG_NODE_ID:?Set a unique per-Mac node ID}
services:
  gateway:
    image: ${GATEWAY_IMAGE:?Build and pin a reviewed gateway image digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:32120:8080"
    environment:
      RDG_NODE_ID: ${RDG_NODE_ID:?Set this node ID}
      RDG_PUBLIC_ORIGIN: ${RDG_PUBLIC_ORIGIN:?Set exact HTTPS origin}
      RDG_ACCESS_ISSUER: ${RDG_ACCESS_ISSUER:?Set trusted Access team issuer}
      RDG_ACCESS_AUDIENCE: ${RDG_ACCESS_AUDIENCE:?Set this Access application audience}
      RDG_OWNER_EMAIL: ${RDG_OWNER_EMAIL:?Set exact approved owner email}
      RDG_TARGET_CONFIG: /app/config/device.json
      RDG_DESKTOP_POLICY: "BLOCKED"
      RDG_LISTEN_PORT: "8080"
      RDG_LISTEN_ADDRESS: "0.0.0.0"
      RDG_WEB_DIR: /app/web
      RDG_STATE_DIR: /var/lib/rdg
    volumes:
      - type: bind
        source: ${RDG_DEVICE_CONFIG:?Set absolute path to validated server device config}
        target: /app/config/device.json
        read_only: true
      - rdg-metadata:/var/lib/rdg
    read_only: true
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=64m,uid=10001,gid=10001,mode=0700,noexec,nosuid"]
    pids_limit: 128
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "java", "-Xmx32m", "-jar", "/app/rdg-gateway.jar", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Process liveness only; never a promise of Screen Sharing authentication.
    networks: [backend]
    security_opt: [no-new-privileges:true]
networks:
  backend:
    driver: bridge
volumes:
  rdg-metadata:
