<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RDG Agent prototype viewer</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  header, footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; }
  #stage { min-height: 0; overflow: auto; background: #111; display: grid; place-items: center; }
  .capture { outline: none; max-width: 100%; max-height: 100%; }
  canvas { display: block; max-width: 100%; max-height: calc(100vh - 140px); cursor: none; }
  #stats { font-variant-numeric: tabular-nums; white-space: pre; }
  textarea { width: 260px; height: 48px; }
  .badge { padding: 2px 6px; border-radius: 4px; background: #8884; }
</style></head>
<body>
<header>
  <strong>RDG Agent · PROTOTYPE · local test only</strong>
  <label>Token <input id="token" type="password" autocomplete="off" size="20"></label>
  <label><input id="control" type="checkbox"> Control</label>
  <label><input id="clipboard" type="checkbox"> Clipboard</label>
  <label>Profile <select id="profile"><option value="mac-native">Mac</option><option value="windows-native">Windows</option><option value="windows-alt-command">Windows · Left Alt → Command</option></select></label>
  <label>Quality <select id="rate"><option value="1500">Smooth 1.5 Mbit/s</option><option value="4000" selected>Balanced 4 Mbit/s</option><option value="8000">Sharp 8 Mbit/s</option></select></label>
  <button id="connect">Connect</button><button id="disconnect" disabled>Disconnect</button>
  <span id="state" class="badge">idle</span>
</header>
<div id="stage"></div>
<footer>
  <span id="stats"></span>
  <textarea id="toMac" placeholder="Text to send to the Mac"></textarea>
  <button id="sendClip">Set Mac clipboard</button><button id="typeText">Type into Mac</button><button id="release">Release keys</button>
  <textarea id="fromMac" placeholder="Mac clipboard (when enabled)" readonly></textarea>
</footer>
<script src="/web/vendor/all.min.js"></script>
<script type="module" src="./viewer.mjs"></script>
</body></html>
