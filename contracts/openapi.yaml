openapi: 3.1.0
info:
  title: PWA Remote Desktop Gateway — local pilot API
  version: 1.0.0
  description: >-
    Implemented project-specific contract, not an existing Guacamole REST API.
    Exact Origin/Host, verified edge identity and server-authorized target resolution
    apply. All responses are no-store. Cookie/CSRF is required after bootstrap.
    Default mode requires Access per API/WS. Explicit OWNER_SETUP with trusted devices
    uses Access only at /login enrollment, and the revocable one-year device cookie
    on all protected API/WS requests; authentication alternatives cannot be mixed.
servers:
  - url: https://remote-mini.example.com
security:
  - accessAssertion: []
    appCookie: []
  - trustedDeviceCookie: []
    appCookie: []
paths:
  /login:
    get:
      operationId: beginBrowserEnrollment
      security: [{accessAssertion: []}]
      description: OWNER_SETUP trust mode only. Verify signed owner Access assertion; issue five-minute, host-only HttpOnly enrollment nonce and same-origin form. Valid existing browser trust redirects without extending its deadline.
      responses:
        '200': {description: Enrollment form with one-time nonce.}
        '303': {description: Existing trusted browser redirects to root.}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: enrollBrowser
      security: [{accessAssertion: []}]
      description: Exact Host/Origin, one-time form nonce plus matching HttpOnly nonce cookie. Issue opaque one-year device cookie; clear old app cookie. No token in response body. Cookie lifetime is fixed at enrollment.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [nonce]
              properties:
                nonce: {type: string, minLength: 43, maxLength: 43}
      responses:
        '303': {description: Device trusted, redirect to root.}
        default: {$ref: '#/components/responses/Error'}
  /api/desktop/credential:
    post:
      operationId: provisionDesktopCredential
      description: Explicit OWNER_SETUP only. AES-GCM server storage, no plaintext echo. Reject while any live desktop or unexpired pending intent exists; fixed server-owned target and unverified test keyboard profile.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
      responses:
        '200': {description: Credential configured and desktop policy flags, never secret/ciphertext/path.}
        default: {$ref: '#/components/responses/Error'}
  /api/trusted-devices:
    get:
      operationId: listTrustedBrowsers
      description: Enabled only with trusted mode. Owner-scoped IDs, createdAt/expiresAt/current metadata; no tokens, identities or private target data.
      responses:
        '200': {description: Devices metadata list.}
        default: {$ref: '#/components/responses/Error'}
  /api/trusted-devices/{deviceId}:
    delete:
      operationId: revokeTrustedBrowser
      description: Revoke specified owner browser and close its app/desktop sessions. Other browsers remain valid. Current device cookie is cleared and reauthenticate is true when revoking this browser.
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '200': {description: Revoked with reauthenticate boolean.}
        default: {$ref: '#/components/responses/Error'}
  /api/session/bootstrap:
    post:
      operationId: bootstrapSession
      description: Exact Origin plus signed owner assertion; create or reuse the same valid owner-bound cookie without extending its deadline. No unauthenticated development bypass.
      security:
        - accessAssertion: []
        - trustedDeviceCookie: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Session established; Set-Cookie is Secure HttpOnly SameSite=Lax Path=/ with __Host- prefix.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [csrfToken, expiresAt, nodeId]
                properties:
                  csrfToken: {type: string, minLength: 32}
                  expiresAt: {type: string, format: date-time}
                  nodeId: {type: string}
        default:
          $ref: '#/components/responses/Error'
  /api/session:
    get:
      operationId: getCurrentSession
      responses:
        '200':
          description: Public current-session projection; never raw JWT/cookie or private target configuration.
          content:
            application/json:
              schema:
                type: object
                required: [expiresAt, activeDesktop]
                properties:
                  expiresAt: {type: string, format: date-time}
                  activeDesktop: {type: boolean}
                  activeDesktopIntentId:
                    type: string
                    pattern: '^[A-Za-z0-9_-]{43}$'
                    description: Present only for this app's current desktop reservation; use this snapshot for scoped recovery. It does not prove a verified Mac display.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: logoutNode
      description: Revoke current app session, close all its upstreams, expire cookie. In trusted mode also revoke this browser and clear its device cookie. Not a fleet-wide or Access-global logout.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      responses:
        '204': {description: Local session revoked and cookie cleared.}
        default:
          $ref: '#/components/responses/Error'
  /api/devices:
    get:
      operationId: listDeviceProjection
      responses:
        '200':
          description: Safe projection; remote bookmarks cannot assert real liveness.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicDevice'
        default:
          $ref: '#/components/responses/Error'
  /api/connect-intents:
    post:
      operationId: createConnectIntent
      description: Desktop policy BLOCKED refuses both view and control with 503 DESKTOP_BLOCKED_BY_POLICY.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceId, mode, keyboardProfile]
              properties:
                deviceId: {type: string, minLength: 3, maxLength: 40}
                mode: {type: string, enum: [view, control]}
                keyboardProfile:
                  type: string
                  enum: [mac-native, windows-native, windows-alt-command]
      responses:
        '201':
          description: Owner-bound one-use 30-second intent; ID alone does not authorize a connection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [intentId, expiresAt]
                properties:
                  intentId: {type: string, minLength: 32, maxLength: 128}
                  expiresAt: {type: string, format: date-time}
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/desktop-session:
    delete:
      operationId: endCurrentDesktop
      description: With an intentId body, cancel exactly that app-owned intent/desktop. An absent body explicitly ends all desktops and pending intents for this shared app session, including other tabs. A foreign app's intent or desktop is denied without mutation. Normal tab cleanup always supplies its own intentId.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intentId]
              properties:
                intentId: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
      responses:
        '204': {description: Selected intent/desktop ended or already absent; app session remains.}
        '403':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/clipboard-consent:
    post:
      operationId: setClipboardConsent
      description: Explicit consent applies to the next control tunnel; reject while an intent/desktop is pending. Read-only tunnels always deny writes. Desktop policy BLOCKED refuses enabled=true with 503 DESKTOP_BLOCKED_BY_POLICY.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200': {description: Consent saved in the transient app session.}
        default:
          $ref: '#/components/responses/Error'
  /api/update-boundary:
    post:
      operationId: reserveUpdateBoundary
      description: Atomically reserve a 20-second node maintenance boundary only with no desktops/pending intents/uncertain cleanup; prevents new intents/upgrades.
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/CSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200': {description: Server reservation granted; safe=true and reservedUntil returned.}
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /api/diagnostics:
    get:
      operationId: getSanitizedDiagnostics
      responses:
        '200': {description: Build/library versions, node alias, configured keysyms, desktopEnabled/desktopPolicy and capability limits; no upstream address or credentials.}
        default:
          $ref: '#/components/responses/Error'
  /api/history:
    get:
      operationId: getSessionMetadataHistory
      responses:
        '200': {description: Up to 50 metadata-only audit events for the bound identity; no input, clipboard, frames or tokens.}
        default:
          $ref: '#/components/responses/Error'
  /ws/sessions/{intentId}:
    get:
      operationId: upgradeDesktopTunnel
      description: >-
        WebSocket upgrade, not a JSON API. Require exact Origin/Host, valid signed
        Access assertion, same owner app cookie, unexpired intent and atomic consume.
        Upgraded frames use the official Guacamole protocol. Do not parse or invent
        JSON key messages. Active expiry and revocation continue after the upgrade.
        Desktop policy BLOCKED refuses an authenticated upgrade with 503 DESKTOP_BLOCKED_BY_POLICY.
      parameters:
        - name: intentId
          in: path
          required: true
          schema: {type: string, minLength: 32, maxLength: 128}
        - $ref: '#/components/parameters/Origin'
      responses:
        '101': {description: Switching protocols only after all authorization checks.}
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    accessAssertion:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Injected by trusted Access edge; gateway verifies JWT. Browser must not supply its own trusted identity.
    trustedDeviceCookie:
      type: apiKey
      in: cookie
      name: __Host-rdg-device
      description: Explicit opt-in only; opaque Secure HttpOnly revocable proof, verified against encrypted server state on every protected API/WS and active lease.
    appCookie:
      type: apiKey
      in: cookie
      name: __Host-rdg
      description: Opaque server-owned session, not the VNC password or JWT.
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      schema: {type: string}
      description: Must exactly equal this node's configured HTTPS origin.
    CSRF:
      name: X-RDG-CSRF
      in: header
      required: true
      schema: {type: string, minLength: 32}
  responses:
    Error:
      description: Bounded error, no credential, token or stack trace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    PublicDevice:
      type: object
      additionalProperties: false
      required: [id, label, kind, status]
      properties:
        id: {type: string}
        label: {type: string}
        kind: {type: string, enum: [local, bookmark]}
        status:
          type: string
          enum: [UNVERIFIED, CHECKING, GATEWAY_REACHABLE, BLOCKED, DESKTOP_READY, OFFLINE, DENIED]
        desktopEnabled: {type: boolean, description: Server policy permits desktop attempts; does not prove availability.}
        desktopPolicy: {type: string, enum: [FULL, BLOCKED, OWNER_SETUP]}
        blockedReason: {type: string, enum: [DESKTOP_BLOCKED_BY_POLICY, VNC_CREDENTIAL_REQUIRED]}
        credentialSetupEnabled: {type: boolean}
        credentialConfigured: {type: boolean}
        keyboardCalibration: {type: string, enum: [OPERATOR_CONFIGURED, UNAVAILABLE, UNVERIFIED_TEST_PROFILE]}
        checkedAt: {type: [string, 'null'], format: date-time}
        launchUrl: {type: string, format: uri}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, auditId]
      properties:
        code: {type: string, maxLength: 64}
        message: {type: string, maxLength: 240}
        auditId: {type: string, maxLength: 80}
